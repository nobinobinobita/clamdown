<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>聲音視覺提示器</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #2c3e50; }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; color: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 5vw;
        }
        #start-overlay h2 { font-size: clamp(1.8rem, 6vw, 3.5rem); }
        #start-overlay p { font-size: clamp(0.9rem, 3vw, 1.5rem); margin-top: 10px; opacity: 0.8; }
        #start-btn {
            margin-top: 25px; padding: 3vh 8vw; font-size: clamp(1.1rem, 4vw, 2rem); border: none;
            border-radius: 40px; background: #27ae60; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #main-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: background-color 0.5s ease; position: relative;
        }

        /* 頂部控制面板 */
        .top-control-panel {
            position: absolute; top: 2vh; left: 3%; width: 94%;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.3); border-radius: 20px; padding: 10px 15px;
            backdrop-filter: blur(8px); z-index: 10;
        }

        /* 可動態改變格數的 VU 音量表 */
        .vu-meter {
            display: flex; gap: 4px; flex-grow: 1; max-width: 65%; height: clamp(18px, 3vh, 30px);
            background: rgba(0,0,0,0.4); padding: 3px; border-radius: 8px;
        }
        .vu-segment {
            flex: 1; background: rgba(255, 255, 255, 0.15); border-radius: 3px;
            transition: background-color 0.1s ease;
        }
        .vu-segment.active-green { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
        .vu-segment.active-yellow { background: #f1c40f; box-shadow: 0 0 6px #f1c40f; }
        .vu-segment.active-red { background: #e74c3c; box-shadow: 0 0 6px #e74c3c; }

        .pause-toggle-btn {
            background: rgba(255,255,255,0.25); color: white; border: 1px solid rgba(255,255,255,0.5);
            padding: 8px 14px; border-radius: 12px; font-weight: bold; font-size: clamp(0.75rem, 2.5vw, 1.1rem);
            cursor: pointer; display: flex; align-items: center; gap: 5px;
        }
        .pause-toggle-btn.paused { background: #e67e22; border-color: #d35400; }

        .display-image {
            max-width: 85%; max-height: 50vh; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: none; object-fit: contain; margin-top: 60px;
        }

        /* 根據螢幕尺寸動態縮放的文字 */
        .status-text {
            margin-top: 25px; font-size: clamp(1.3rem, 4.5vw, 2.8rem); font-weight: bold; color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4); text-align: center; padding: 0 5vw; line-height: 1.3;
        }

        #settings-icon {
            position: absolute; bottom: 2vh; right: 3vw; font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: rgba(255,255,255,0.4); z-index: 50; cursor: pointer; padding: 10px;
        }

        #password-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); color: white; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 300; padding: 20px;
        }
        #password-modal input {
            padding: 12px 20px; font-size: 1.2rem; text-align: center; border-radius: 10px;
            border: 2px solid #3498db; margin: 15px 0; width: 200px; outline: none;
        }
        .pwd-btn-group { display: flex; gap: 10px; }
        .pwd-btn { padding: 10px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .pwd-confirm { background: #3498db; color: white; }
        .pwd-cancel { background: #e74c3c; color: white; }

        #settings-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; display: none; flex-direction: column;
            z-index: 200; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        #settings-modal h3 { margin-bottom: 15px; text-align: center; font-size: clamp(1.1rem, 3.5vw, 1.6rem); }

        .param-group {
            background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 12px;
        }
        .param-group label { font-size: clamp(0.8rem, 2.5vw, 1rem); color: #ccc; display: block; margin-bottom: 6px; }
        .param-group input[type="range"] { width: 100%; margin-top: 5px; }
        .param-group input[type="number"], .param-group select {
            width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #555;
            background: #222; color: white; font-size: clamp(0.85rem, 2.5vw, 1rem);
        }

        .tab-container { display: flex; margin-bottom: 12px; border-bottom: 2px solid #444; }
        .tab-btn {
            flex: 1; padding: 10px; background: none; border: none; color: #888;
            font-size: clamp(0.85rem, 2.5vw, 1.1rem); font-weight: bold; cursor: pointer; text-align: center;
        }
        .tab-btn.active { color: #3498db; border-bottom: 3px solid #3498db; }

        .add-card-section {
            background: rgba(255,255,255,0.05); border: 1px dashed #666; padding: 12px;
            border-radius: 10px; margin-bottom: 15px; text-align: center;
        }
        .add-card-section input[type="text"] {
            width: 100%; padding: 8px; margin-top: 8px; margin-bottom: 8px;
            border-radius: 6px; border: 1px solid #444; background: #111; color: white; font-size: 0.9rem;
        }
        .custom-upload-btn {
            background: #3498db; color: white; padding: 8px 15px; border-radius: 8px;
            display: inline-block; font-weight: bold; cursor: pointer; font-size: 0.85rem;
        }
        #file-input { display: none; }

        .card-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; flex-grow: 1; }
        .card-item {
            display: flex; align-items: center; background: rgba(255,255,255,0.1);
            padding: 8px; border-radius: 8px; gap: 10px; border: 2px solid transparent;
        }
        .card-item.selected-target { border-color: #2ecc71; background: rgba(46, 204, 113, 0.2); }
        .card-item img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
        .card-item .card-info { flex-grow: 1; font-size: 0.85rem; color: #ddd; word-break: break-all; }
        .card-item .delete-card-btn {
            background: #e74c3c; color: white; border: none; padding: 5px 10px;
            border-radius: 5px; font-weight: bold; cursor: pointer;
        }

        .close-modal-btn {
            background: #27ae60; color: white; padding: 12px; border: none;
            border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2>聲音視覺提示器</h2>
        <p>請點擊按鈕開啟麥克風監測</p>
        <button id="start-btn">開始使用</button>
    </div>

    <div id="main-container">
        <div class="top-control-panel">
            <div class="vu-meter" id="vu-meter"></div>
            <button id="pause-btn" class="pause-toggle-btn">⏸️ 監測中</button>
        </div>

        <img id="display-img" class="display-image" src="" alt="提示圖片">
        <div id="status-text" class="status-text">...</div>
        <div id="settings-icon">⚙️</div>
    </div>

    <div id="password-modal">
        <h3>🔒 家長/老師身份驗證</h3>
        <p style="font-size:0.85rem; color:#ccc; margin-top:5px;">請輸入密碼以進行管理</p>
        <input type="password" id="pwd-input" placeholder="請輸入密碼" pattern="[0-9]*" inputmode="numeric">
        <div class="pwd-btn-group">
            <button class="pwd-btn pwd-cancel" id="pwd-cancel-btn">取消</button>
            <button class="pwd-btn pwd-confirm" id="pwd-confirm-btn">確定</button>
        </div>
    </div>

    <!-- 管理面板 -->
    <div id="settings-modal">
        <h3>⚙️ 個別化參數與圖文設定</h3>

        <!-- 參數設定區 -->
        <div class="param-group">
            <label for="threshold-slider">🎚️ 觸發分貝門檻 (目前：<span id="threshold-val">35</span>)：</label>
            <input type="range" id="threshold-slider" min="15" max="80" value="35">
        </div>

        <div class="param-group">
            <label for="cooldown-sec-input">⏱️ 冷靜持續時間 (秒)：</label>
            <input type="number" id="cooldown-sec-input" min="5" max="600" value="180">
        </div>

        <div class="param-group">
            <label for="vu-count-select">📊 音量表顯示格數：</label>
            <select id="vu-count-select">
                <option value="5">5 格 (簡潔視圖)</option>
                <option value="10" selected>10 格 (標準視圖)</option>
                <option value="15">15 格 (精細視圖)</option>
            </select>
        </div>

        <div class="tab-container">
            <button id="tab-quiet" class="tab-btn active" onclick="switchTab('quiet')">🟢 平靜獎勵卡</button>
            <button id="tab-loud" class="tab-btn" onclick="switchTab('loud')">🔵 冷靜提示卡</button>
        </div>

        <div class="param-group">
            <label id="mode-label" for="mode-select">卡片播放模式：</label>
            <select id="mode-select">
                <option value="random">🎲 隨機輪播所有卡片</option>
            </select>
        </div>

        <div class="add-card-section">
            <label for="file-input" class="custom-upload-btn">📷 1. 選擇相片</label>
            <input type="file" id="file-input" accept="image/*">
            <input type="text" id="card-text-input" placeholder="2. 輸入專屬提示/獎勵文字">
            <button id="add-card-btn" style="background:#27ae60; color:white; border:none; padding:8px 15px; border-radius:6px; font-weight:bold; width:100%; margin-top:5px;">➕ 建立圖文卡片</button>
        </div>

        <div id="card-list" class="card-list"></div>

        <button id="close-modal-btn" class="close-modal-btn">完成並儲存</button>
    </div>

    <script>
        const PARENT_PASSWORD = "0000";
        const COLOR_QUIET = "#2ecc71";
        const COLOR_LOUD = "#3498db";

        // 動態參數預設值
        let highDbThreshold = 35; 
        let quietHoldTimeMs = 180000; // 180 秒
        let vuSegmentCount = 10;     // 10 格音量表

        const DEFAULT_QUIET_CARDS = [{
            img: "https://images.unsplash.com/photo-1532105956626-9569c03602f6?w=600",
            text: "保持平靜，做得好！"
        }];
        const DEFAULT_LOUD_CARDS = [{
            img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=600",
            text: "聲音太大囉，試試深呼吸..."
        }];

        let quietCards = [];
        let loudCards = [];
        let quietMode = 'random';
        let loudMode = 'random';

        let currentTab = 'quiet';
        let pendingImageBase64 = null;

        let audioContext, analyser, microphone, stream;
        let isLoud = false;
        let isPaused = false;
        let quietStartTime = null;

        const startBtn = document.getElementById('start-btn');
        const startOverlay = document.getElementById('start-overlay');
        const mainContainer = document.getElementById('main-container');
        const displayImg = document.getElementById('display-img');
        const statusText = document.getElementById('status-text');
        const pauseBtn = document.getElementById('pause-btn');
        const vuMeter = document.getElementById('vu-meter');
        
        const settingsIcon = document.getElementById('settings-icon');
        const passwordModal = document.getElementById('password-modal');
        const pwdInput = document.getElementById('pwd-input');
        const pwdConfirmBtn = document.getElementById('pwd-confirm-btn');
        const pwdCancelBtn = document.getElementById('pwd-cancel-btn');

        const settingsModal = document.getElementById('settings-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const fileInput = document.getElementById('file-input');
        const cardTextInput = document.getElementById('card-text-input');
        const addCardBtn = document.getElementById('add-card-btn');
        const cardList = document.getElementById('card-list');
        const modeSelect = document.getElementById('mode-select');

        const thresholdSlider = document.getElementById('threshold-slider');
        const thresholdVal = document.getElementById('threshold-val');
        const cooldownSecInput = document.getElementById('cooldown-sec-input');
        const vuCountSelect = document.getElementById('vu-count-select');

        loadStoredData();
        buildVuMeterSegments();

        startBtn.onclick = function() {
            startBtn.innerText = "正在開啟麥克風...";

            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioCtx();
            audioContext.resume();

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('錯誤：請確定網址包含 https://，且已允許存取麥克風。');
                startBtn.innerText = "開始使用";
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(function(micStream) {
                    stream = micStream;
                    analyser = audioContext.createAnalyser();
                    microphone = audioContext.createMediaStreamSource(stream);
                    analyser.fftSize = 256;
                    microphone.connect(analyser);

                    startOverlay.style.display = 'none';
                    setQuietState();
                    processAudio();
                })
                .catch(function(err) {
                    alert('無法開啟麥克風：' + err.message + '\n請至 iPhone 設定 > Safari > 麥克風 改為「允許」。');
                    startBtn.innerText = "開始使用";
                });
        };

        pauseBtn.addEventListener('click', function() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseBtn.textContent = "▶️ 已暫停 (點擊恢復)";
                pauseBtn.classList.add('paused');
                document.querySelectorAll('.vu-segment').forEach(s => s.className = 'vu-segment');
            } else {
                pauseBtn.textContent = "⏸️ 監測中";
                pauseBtn.classList.remove('paused');
            }
        });

        // 參數變更即時連動
        thresholdSlider.addEventListener('input', function() {
            highDbThreshold = parseInt(this.value);
            thresholdVal.textContent = highDbThreshold;
        });

        cooldownSecInput.addEventListener('change', function() {
            quietHoldTimeMs = Math.max(5, parseInt(this.value) || 10) * 1000;
        });

        vuCountSelect.addEventListener('change', function() {
            vuSegmentCount = parseInt(this.value);
            buildVuMeterSegments();
        });

        function buildVuMeterSegments() {
            vuMeter.innerHTML = '';
            for (let i = 0; i < vuSegmentCount; i++) {
                const seg = document.createElement('div');
                seg.className = 'vu-segment';
                vuMeter.appendChild(seg);
            }
        }

        settingsIcon.addEventListener('click', function() {
            pwdInput.value = '';
            passwordModal.style.display = 'flex';
            pwdInput.focus();
        });

        pwdCancelBtn.addEventListener('click', function() { passwordModal.style.display = 'none'; });
        pwdConfirmBtn.addEventListener('click', verifyPassword);
        pwdInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') verifyPassword(); });

        function verifyPassword() {
            if (pwdInput.value === PARENT_PASSWORD) {
                passwordModal.style.display = 'none';
                settingsModal.style.display = 'flex';
                
                // 帶入目前設定值
                thresholdSlider.value = highDbThreshold;
                thresholdVal.textContent = highDbThreshold;
                cooldownSecInput.value = quietHoldTimeMs / 1000;
                vuCountSelect.value = vuSegmentCount;

                renderUI();
            } else {
                alert('密碼錯誤！');
                pwdInput.value = '';
            }
        }

        closeModalBtn.addEventListener('click', function() {
            saveDataToStorage();
            settingsModal.style.display = 'none'; 
        });

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tab-quiet').classList.toggle('active', tab === 'quiet');
            document.getElementById('tab-loud').classList.toggle('active', tab === 'loud');
            renderUI();
        };

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) { pendingImageBase64 = event.target.result; };
            reader.readAsDataURL(file);
        });

        addCardBtn.addEventListener('click', function() {
            if (!pendingImageBase64) {
                alert('請先選擇一張照片！');
                return;
            }
            const text = cardTextInput.value.trim() || (currentTab === 'quiet' ? '保持平靜！' : '請深呼吸...');
            const targetCards = currentTab === 'quiet' ? quietCards : loudCards;
            targetCards.push({ img: pendingImageBase64, text: text });
            
            pendingImageBase64 = null;
            fileInput.value = '';
            cardTextInput.value = '';
            saveDataToStorage();
            renderUI();
        });

        modeSelect.addEventListener('change', function() {
            if (currentTab === 'quiet') quietMode = modeSelect.value;
            else loudMode = modeSelect.value;
            saveDataToStorage();
            renderUI();
        });

        function renderUI() {
            const targetCards = currentTab === 'quiet' ? quietCards : loudCards;
            const currentMode = currentTab === 'quiet' ? quietMode : loudMode;

            modeSelect.innerHTML = '<option value="random">🎲 隨機輪播所有卡片</option>';
            targetCards.forEach((card, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = `🎯 專注訓練卡片 #${index + 1}: ${card.text.substring(0, 10)}...`;
                if (currentMode == index) opt.selected = true;
            });
            if (currentMode === 'random') modeSelect.value = 'random';

            cardList.innerHTML = '';
            if (targetCards.length === 0) {
                cardList.innerHTML = '<p style="text-align:center; color:#888; font-size:0.85rem;">目前尚未新增自訂卡片，正使用預設圖文。</p>';
                return;
            }

            targetCards.forEach((card, index) => {
                const item = document.createElement('div');
                item.className = 'card-item' + (currentMode == index ? ' selected-target' : '');
                item.innerHTML = `
                    <img src="${card.img}">
                    <div class="card-info">${card.text}</div>
                    <button class="delete-card-btn" onclick="deleteCard(${index})">刪除</button>
                `;
                cardList.appendChild(item);
            });
        }

        window.deleteCard = function(index) {
            const targetCards = currentTab === 'quiet' ? quietCards : loudCards;
            targetCards.splice(index, 1);
            if (currentTab === 'quiet') quietMode = 'random';
            else loudMode = 'random';
            saveDataToStorage();
            renderUI();
        };

        function saveDataToStorage() {
            try {
                localStorage.setItem('user_quiet_cards', JSON.stringify(quietCards));
                localStorage.setItem('user_loud_cards', JSON.stringify(loudCards));
                localStorage.setItem('user_quiet_mode', quietMode);
                localStorage.setItem('user_loud_mode', loudMode);
                localStorage.setItem('user_threshold', highDbThreshold);
                localStorage.setItem('user_cooldown_ms', quietHoldTimeMs);
                localStorage.setItem('user_vu_count', vuSegmentCount);
            } catch (e) {
                alert('儲存失敗：照片空間不足！');
            }
        }

        function loadStoredData() {
            const storedQuiet = localStorage.getItem('user_quiet_cards');
            const storedLoud = localStorage.getItem('user_loud_cards');
            const storedQMode = localStorage.getItem('user_quiet_mode');
            const storedLMode = localStorage.getItem('user_loud_mode');
            const storedThresh = localStorage.getItem('user_threshold');
            const storedCool = localStorage.getItem('user_cooldown_ms');
            const storedVu = localStorage.getItem('user_vu_count');
            
            if (storedQuiet) { try { quietCards = JSON.parse(storedQuiet); } catch(e) {} }
            if (storedLoud) { try { loudCards = JSON.parse(storedLoud); } catch(e) {} }
            if (storedQMode) quietMode = storedQMode;
            if (storedLMode) loudMode = storedLMode;
            if (storedThresh) highDbThreshold = parseInt(storedThresh);
            if (storedCool) quietHoldTimeMs = parseInt(storedCool);
            if (storedVu) vuSegmentCount = parseInt(storedVu);
        }

        function processAudio() {
            if (!isPaused && analyser) {
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);

                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                
                let rawDb = Math.round(((sum / dataArray.length) / 255) * 100);
                let currentDb = Math.min(Math.round(rawDb * 2.2), 100); 

                // 根據自訂格數計算比率
                let activeBarCount = Math.min(Math.floor((currentDb / 100) * vuSegmentCount), vuSegmentCount);
                const segments = document.querySelectorAll('.vu-segment');
                
                segments.forEach((segment, index) => {
                    segment.className = 'vu-segment';
                    if (index < activeBarCount) {
                        let ratio = index / vuSegmentCount;
                        if (ratio < 0.5) segment.classList.add('active-green');
                        else if (ratio < 0.8) segment.classList.add('active-yellow');
                        else segment.classList.add('active-red');
                    }
                });

                if (isLoud) {
                    mainContainer.style.backgroundColor = COLOR_LOUD;
                } else {
                    mainContainer.style.backgroundColor = COLOR_QUIET;
                }

                const now = Date.now();

                if (currentDb > highDbThreshold) {
                    quietStartTime = null;
                    if (!isLoud) setLoudState();
                } else {
                    if (isLoud) {
                        if (!quietStartTime) {
                            quietStartTime = now;
                        } else {
                            let elapsed = now - quietStartTime;
                            let remainingSec = Math.ceil((quietHoldTimeMs - elapsed) / 1000);

                            if (remainingSec > 0) {
                                const card = getActiveCard('loud');
                                statusText.textContent = `${card.text} (倒數 ${remainingSec} 秒)`;
                            } else {
                                setQuietState();
                            }
                        }
                    }
                }
            }
            requestAnimationFrame(processAudio);
        }

        function getActiveCard(type) {
            const cards = type === 'quiet' ? (quietCards.length > 0 ? quietCards : DEFAULT_QUIET_CARDS) 
                                           : (loudCards.length > 0 ? loudCards : DEFAULT_LOUD_CARDS);
            const mode = type === 'quiet' ? quietMode : loudMode;

            if (mode === 'random' || mode >= cards.length) {
                return cards[Math.floor(Math.random() * cards.length)];
            } else {
                return cards[mode];
            }
        }

        function setQuietState() {
            isLoud = false;
            mainContainer.style.backgroundColor = COLOR_QUIET;
            const card = getActiveCard('quiet');
            displayImg.src = card.img;
            displayImg.style.display = 'block';
            statusText.textContent = card.text;
        }

        function setLoudState() {
            isLoud = true;
            mainContainer.style.backgroundColor = COLOR_LOUD;
            const card = getActiveCard('loud');
            displayImg.src = card.img;
            displayImg.style.display = 'block';
            statusText.textContent = card.text;
        }
    </script>
</body>
</html>
