<script>
    const PARENT_PASSWORD = "0000";
    const HIGH_DB_THRESHOLD = 60;
    const QUIET_HOLD_TIME_MS = 3000;
    const COLOR_QUIET = "#2ecc71";
    const COLOR_LOUD = "#3498db";

    const DEFAULT_QUIET_IMAGES = ["https://images.unsplash.com/photo-1532105956626-9569c03602f6?w=600"];
    const DEFAULT_LOUD_IMAGES = ["https://images.unsplash.com/photo-1506126613408-eca07ce68773?w=600"];

    let quietImages = [];
    let loudImages = [];
    let currentTab = 'quiet';

    let audioContext, analyser, microphone, stream;
    let isLoud = false;
    let quietStartTime = null;

    const startBtn = document.getElementById('start-btn');
    const startOverlay = document.getElementById('start-overlay');
    const mainContainer = document.getElementById('main-container');
    const displayImg = document.getElementById('display-img');
    const statusText = document.getElementById('status-text');
    
    const settingsIcon = document.getElementById('settings-icon');
    const passwordModal = document.getElementById('password-modal');
    const pwdInput = document.getElementById('pwd-input');
    const pwdConfirmBtn = document.getElementById('pwd-confirm-btn');
    const pwdCancelBtn = document.getElementById('pwd-cancel-btn');

    const settingsModal = document.getElementById('settings-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const fileInput = document.getElementById('file-input');
    const photoGrid = document.getElementById('photo-grid');
    const uploadLabel = document.getElementById('upload-label');

    loadStoredImages();

    // 針對 iOS 最佳化的啟動邏輯
    startBtn.onclick = function() {
        startBtn.innerText = "載入中...";
        
        // 1. 先在點擊事件中同步建立/解鎖 AudioContext
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioCtx();
        audioContext.resume();

        // 2. 請求麥克風存取
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('錯誤：此瀏覽器不支援麥克風存取，請確保網址為 https://！');
            startBtn.innerText = "開始使用";
            return;
        }

        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(function(micStream) {
                stream = micStream;
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                analyser.fftSize = 256;
                microphone.connect(analyser);

                startOverlay.style.display = 'none';
                setQuietState();
                processAudio();
            })
            .catch(function(err) {
                alert('無法取得麥克風權限：' + err.name + ' - ' + err.message);
                startBtn.innerText = "開始使用";
            });
    };

    settingsIcon.addEventListener('click', () => {
        pwdInput.value = '';
        passwordModal.style.display = 'flex';
        pwdInput.focus();
    });

    pwdCancelBtn.addEventListener('click', () => { passwordModal.style.display = 'none'; });
    pwdConfirmBtn.addEventListener('click', verifyPassword);
    pwdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifyPassword(); });

    function verifyPassword() {
        if (pwdInput.value === PARENT_PASSWORD) {
            passwordModal.style.display = 'none';
            settingsModal.style.display = 'flex';
            renderPhotoGrid();
        } else {
            alert('密碼錯誤！');
            pwdInput.value = '';
        }
    }

    closeModalBtn.addEventListener('click', () => { settingsModal.style.display = 'none'; });

    window.switchTab = function(tab) {
        currentTab = tab;
        document.getElementById('tab-quiet').classList.toggle('active', tab === 'quiet');
        document.getElementById('tab-loud').classList.toggle('active', tab === 'loud');
        uploadLabel.textContent = tab === 'quiet' ? '➕ 上傳平靜獎勵圖' : '➕ 上傳冷靜提示圖';
        renderPhotoGrid();
    };

    fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (!files.length) return;
        const targetArray = currentTab === 'quiet' ? quietImages : loudImages;

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                targetArray.push(event.target.result);
                saveImagesToStorage();
                renderPhotoGrid();
            };
            reader.readAsDataURL(file);
        });
    });

    function renderPhotoGrid() {
        photoGrid.innerHTML = '';
        const targetArray = currentTab === 'quiet' ? quietImages : loudImages;

        targetArray.forEach((imgSrc, index) => {
            const item = document.createElement('div');
            item.className = 'photo-item';
            item.innerHTML = `
                <img src="${imgSrc}">
                <button class="delete-btn" onclick="deleteImage(${index})">×</button>
            `;
            photoGrid.appendChild(item);
        });
    }

    window.deleteImage = function(index) {
        const targetArray = currentTab === 'quiet' ? quietImages : loudImages;
        targetArray.splice(index, 1);
        saveImagesToStorage();
        renderPhotoGrid();
    };

    function saveImagesToStorage() {
        try {
            localStorage.setItem('user_quiet_images', JSON.stringify(quietImages));
            localStorage.setItem('user_loud_images', JSON.stringify(loudImages));
        } catch (e) {
            alert('儲存失敗：照片空間不足！');
        }
    }

    function loadStoredImages() {
        const storedQuiet = localStorage.getItem('user_quiet_images');
        const storedLoud = localStorage.getItem('user_loud_images');
        if (storedQuiet) { try { quietImages = JSON.parse(storedQuiet); } catch(e) {} }
        if (storedLoud) { try { loudImages = JSON.parse(storedLoud); } catch(e) {} }
    }

    function processAudio() {
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);

        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let currentDb = Math.round(((sum / dataArray.length) / 255) * 100);

        const now = Date.now();

        if (currentDb > HIGH_DB_THRESHOLD) {
            quietStartTime = null;
            if (!isLoud) setLoudState();
        } else {
            if (isLoud) {
                if (!quietStartTime) {
                    quietStartTime = now;
                } else if (now - quietStartTime >= QUIET_HOLD_TIME_MS) {
                    setQuietState();
                }
            }
        }
        requestAnimationFrame(processAudio);
    }

    function setQuietState() {
        isLoud = false;
        mainContainer.style.backgroundColor = COLOR_QUIET;
        const activeList = quietImages.length > 0 ? quietImages : DEFAULT_QUIET_IMAGES;
        displayImg.src = activeList[Math.floor(Math.random() * activeList.length)];
        displayImg.style.display = 'block';
        statusText.textContent = "保持平靜，做得好！";
    }

    function setLoudState() {
        isLoud = true;
        mainContainer.style.backgroundColor = COLOR_LOUD;
        const activeList = loudImages.length > 0 ? loudImages : DEFAULT_LOUD_IMAGES;
        displayImg.src = activeList[Math.floor(Math.random() * activeList.length)];
        displayImg.style.display = 'block';
        statusText.textContent = "聲音太大囉，試試這個冷靜方法...";
    }
</script>
