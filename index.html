<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>聲音視覺提示器</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; background: #2c3e50; }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #2c3e50; color: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px;
        }
        #start-btn {
            margin-top: 20px; padding: 15px 40px; font-size: 1.2rem; border: none;
            border-radius: 30px; background: #27ae60; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #main-container {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: background-color 0.8s ease; position: relative;
        }

        /* 長期顯示的頂部音量表 */
        .volume-meter-container {
            position: absolute; top: 20px; left: 5%; width: 90%;
            background: rgba(0, 0, 0, 0.25); border-radius: 15px; padding: 10px 15px;
            display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(5px);
        }
        .volume-meter-bar-bg {
            width: 100%; height: 16px; background: rgba(255, 255, 255, 0.3);
            border-radius: 8px; overflow: hidden; margin-top: 5px;
        }
        .volume-meter-bar-fill {
            height: 100%; width: 0%; background: #2ecc71;
            transition: width 0.1s ease-out, background-color 0.3s ease; border-radius: 8px;
        }
        .volume-text {
            color: white; font-size: 0.9rem; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        .display-image {
            max-width: 85%; max-height: 55vh; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: none; object-fit: contain; margin-top: 40px;
        }

        .status-text {
            margin-top: 20px; font-size: 1.8rem; font-weight: bold; color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2); text-align: center; padding: 0 20px;
        }

        #settings-icon {
            position: absolute; bottom: 15px; right: 15px; font-size: 1.5rem;
            color: rgba(255,255,255,0.4); z-index: 50; cursor: pointer; padding: 10px;
        }

        /* 密碼視窗（不暴露密碼） */
        #password-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); color: white; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 300; padding: 20px;
        }
        #password-modal input {
            padding: 12px 20px; font-size: 1.2rem; text-align: center; border-radius: 10px;
            border: 2px solid #3498db; margin: 15px 0; width: 200px; outline: none;
        }
        .pwd-btn-group { display: flex; gap: 10px; }
        .pwd-btn { padding: 10px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .pwd-confirm { background: #3498db; color: white; }
        .pwd-cancel { background: #e74c3c; color: white; }

        #settings-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; display: none; flex-direction: column;
            z-index: 200; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        #settings-modal h3 { margin-bottom: 15px; text-align: center; font-size: 1.3rem; }

        .tab-container { display: flex; margin-bottom: 15px; border-bottom: 2px solid #444; }
        .tab-btn {
            flex: 1; padding: 12px; background: none; border: none; color: #888;
            font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center;
        }
        .tab-btn.active { color: #3498db; border-bottom: 3px solid #3498db; }

        .upload-btn-wrapper { text-align: center; margin-bottom: 15px; }
        .custom-upload-btn {
            background: #3498db; color: white; padding: 10px 18px; border-radius: 10px;
            display: inline-block; font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }
        #file-input { display: none; }

        .photo-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; flex-grow: 1;
        }
        .photo-item {
            position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; border: 2px solid #555;
        }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .delete-btn {
            position: absolute; top: 2px; right: 2px; background: red; color: white;
            border: none; border-radius: 50%; width: 22px; height: 22px; font-weight: bold; cursor: pointer;
        }

        .close-modal-btn {
            background: #27ae60; color: white; padding: 12px; border: none;
            border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h2>聲音視覺提示器</h2>
        <p style="margin-top:10px; opacity:0.8;">請點擊按鈕開啟麥克風監測</p>
        <button id="start-btn">開始使用</button>
    </div>

    <div id="main-container">
        <!-- 長期顯示的音量指示條 -->
        <div class="volume-meter-container">
            <div id="volume-text" class="volume-text">音量強度: 0 / 100</div>
            <div class="volume-meter-bar-bg">
                <div id="volume-bar-fill" class="volume-meter-bar-fill"></div>
            </div>
        </div>

        <img id="display-img" class="display-image" src="" alt="提示圖片">
        <div id="status-text" class="status-text">...</div>
        <div id="settings-icon">⚙️</div>
    </div>

    <div id="password-modal">
        <h3>🔒 家長身份驗證</h3>
        <p style="font-size:0.85rem; color:#ccc; margin-top:5px;">請輸入密碼以進行管理</p>
        <input type="password" id="pwd-input" placeholder="請輸入密碼" pattern="[0-9]*" inputmode="numeric">
        <div class="pwd-btn-group">
            <button class="pwd-btn pwd-cancel" id="pwd-cancel-btn">取消</button>
            <button class="pwd-btn pwd-confirm" id="
